};

V.plannedDetail = s => {
  if (readinessState === 'idle') loadReadiness();
  const q = READINESS?.queue?.find(r => r.sprint_id === s.sprint);
  const wait = html => readinessError ? `<div class="note flag">${esc(readinessError)}</div>` : !READINESS ? `<div class="card">${sk('100%', 60)}</div>` : !q ? '<div class="card muted">Not in the planned queue.</div>' : html();
  return `<p>${backLink(s)}</p>
  <div class="row">${label(s)}<span class="pill">planned · position ${s.position}</span>${planeLink(s)}</div>
  <h1 style="margin-top:6px">${esc(s.title)}</h1><p class="goal">${esc(s.goal)}</p>
  <h2>Size</h2>${sizeHtml(s, q)}
  <h2>Dependencies</h2>${wait(() => `<div class="card" style="overflow-x:auto">${chainSvg(s)}</div>`)}
  <h2>Readiness</h2>${wait(() => readinessPanels(q))}
  <h2>Cards</h2>${wait(() => cardListHtml(q))}
  <h2>Execution guidance</h2><div class="card prose">${esc(s.execution) || '—'}</div>
  <h2>Acceptance</h2><div class="card prose">${esc(s.acceptance)}</div>`;
};

let pastSort = { k: 'ended', d: -1 }, pastQ = '';
V.past = () => {
  if (!past.length) return '<h1>Past sprints</h1><p class="muted">No completed sprints.</p>';
  const maxH = Math.max(...past.map(s => s.hours || 0)), maxP = Math.max(...past.map(s => Math.max(s.points_start || 0, s.points_end || 0)));
  const maxC = Math.max(...past.map(s => Math.max(s.cards_start || 0, s.cards_end || 0)));
  const rows = past.filter(s => !pastQ || `${s.title} ${s.alias || ''} ${s.sprint}`.toLowerCase().includes(pastQ))
    .sort((a, b) => { const x = sortValue(a), y = sortValue(b); return ((x ?? -1) > (y ?? -1) ? 1 : -1) * pastSort.d; });
  const th = (k, t, extra = '') => `<th class="sort" onclick="sortPast('${k}')">${t}${pastSort.k === k ? (pastSort.d > 0 ? ' ▲' : ' ▼') : ''}${extra}</th>`;
  return `<h1>Past sprints</h1>
  <div class="row" style="margin:8px 0 12px"><input id="q" placeholder="Filter by title, alias, id" value="${esc(pastQ)}"
    style="font:inherit;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);min-width:240px"
    oninput="pastQ=this.value.toLowerCase();render();const q=document.getElementById('q');q.focus();q.setSelectionRange(q.value.length,q.value.length)">
    <span class="muted">${rows.length} of ${past.length}</span><span class="sp"></span>${segLegend}</div>
  <div class="card scroll" style="padding:4px 6px"><table><thead><tr>${th('sprint', 'Sprint')}${th('title', 'Title')}${th('ended', 'Ended')}
    ${th('cards_end', 'Cards')}${POINTS ? th('points_end', 'Points') : ''}${th('hours', 'Duration', ' <span class="muted">· log₂</span>')}${POINTS ? th('velocity', 'Velocity', ' <span class="muted">· pts/h, log₂</span>') : ''}</tr></thead><tbody>
  ${rows.map(s => `<tr class="link" ${goto(s.sprint)}><td style="white-space:nowrap">${label(s)}</td><td>${esc(s.title)}</td>
    <td class="t2 small" style="white-space:nowrap" data-tip="${esc(fullDate(s.ended))}">${ago(s.ended)}</td>
    <td style="min-width:120px">${cardRow(s.cards_start, s.cards_end)}<div class="muted small">${s.cards_start} → ${s.cards_end} cards</div></td>
    ${POINTS ? `<td style="min-width:200px">${outcome(s.points_start, s.points_end, maxP)}<div class="muted small">${s.points_start} → ${s.points_end} pts</div></td>` : ''}
    <td style="min-width:170px">${hbar(s.hours, maxH, fmtH(s.hours), 'var(--dur)', { log: true, lo: 0.125 })}</td>
    ${POINTS ? `<td><div class="gsm">${dial(s.velocity)}<span>${num(s.velocity, 2)}</span></div></td>` : ''}</tr>`).join('')}</tbody></table></div>`;
};
// Times compare as instants: the register mixes offsets (+08:00, +00:00, Z),
// so their text does not sort in time order.
const sortValue = s => pastSort.k === 'sprint' ? s.sprint
  : ['started', 'ended'].includes(pastSort.k) ? Date.parse(s[pastSort.k]) : s[pastSort.k];
window.sortPast = k => { pastSort = { k, d: pastSort.k === k ? -pastSort.d : -1 }; render(); };

V.pastDetail = s => {
  const i = past.indexOf(s), prev = past[i - 1], next = past[i + 1], t = s.timing;
  const res = t ? Object.entries(t.residence_minutes || {}).filter(([k]) => !TERMINAL.has(k)) : [], exec = t ? Object.entries(t.execution_minutes || {}).filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]) : [];
  const mx = Math.max(1, ...res.map(x => x[1]), ...exec.map(x => x[1]));
  return `<div class="row">${backLink(s)}<span class="sp"></span>
    ${prev ? `<a href="${sprintHref(prev.sprint)}">‹ ${esc(prev.alias || '#' + prev.sprint)}</a>` : ''}${next ? `<a href="${sprintHref(next.sprint)}">${esc(next.alias || '#' + next.sprint)} ›</a>` : ''}</div>
  <div class="row" style="margin-top:10px">${label(s)}<span class="pill" style="color:var(--st-done)">✓ completed</span>${planeLink(s)}<span class="sp"></span>
    <span class="muted small" data-tip="${esc(fullDate(s.started) + ' → ' + fullDate(s.ended))}">ended ${ago(s.ended)} · ran ${s.elapsed}</span></div>
  <h1 style="margin-top:6px">${esc(s.title)}</h1><p class="goal">${esc(s.goal)}</p>
  <div class="grid g4" style="margin:16px 0">
    <div class="card kpi"><div class="v">${s.elapsed}</div><div class="l">Duration</div></div>
    ${POINTS ? `<div class="card kpi"><div class="v">${s.points}</div><div class="l">Points start → end</div><div style="margin-top:8px;max-width:${Math.max(1, s.points_start, s.points_end) * 14}px">${outcome(s.points_start, s.points_end, Math.max(1, s.points_start, s.points_end))}</div></div>` : ''}
    <div class="card kpi"><div class="v">${s.cards}</div><div class="l">Cards start → end</div></div>
    ${POINTS ? `<div class="card kpi"><div class="v">${num(s.velocity, 2)}<span class="muted small"> pts/h</span></div><div class="l nowrap">Velocity · med ${num(MEDV, 2)}</div><div class="gwrap">${dial(s.velocity, true)}</div></div>` : ''}
  </div>
  ${t ? `<div class="grid g2"><div class="card"><h3>State residence (card-time)</h3>${res.map(([k, v]) => `<div class="row small"><span style="width:90px" class="t2">${k}</span><div style="flex:1">${hbar(v, mx, fmtMin(v), stC[k] || 'var(--muted)')}</div></div>`).join('')}</div>
    <div class="card"><h3>Timers · rework ${t.rework_count} on ${t.reworked_cards} cards${t.rework_minutes ? ` · ${fmtMin(t.rework_minutes)} reworking` : ''}</h3>${reasonText(t.rework_reasons) ? `<p class="small t2" style="margin:-4px 0 8px">Reasons: ${reasonText(t.rework_reasons)}</p>` : ''}${exec.map(([k, v]) => `<div class="row small"><span style="width:110px" class="t2">${k}</span><div style="flex:1">${hbar(v, mx, fmtMin(v), timerColor(k))}</div></div>`).join('') || '<span class="muted">No timers.</span>'}</div></div>`
    : '<p class="muted">No timing snapshots for this sprint.</p>'}
  <h2>Delivered</h2><div class="card prose">${esc(s.delivered)}</div>
  <h2>Retrospective</h2><div class="card prose">${esc(s.retrospective) || '<span class="muted">None recorded.</span>'}</div>
  <h2>Acceptance</h2><div class="card prose">${esc(s.acceptance)}</div>`;
};

V.sprint = id => { const s = byId[id]; if (!s) return '<p>Unknown sprint.</p>';
  return s.status === 'planned' ? V.plannedDetail(s) : s.status === 'completed' ? V.pastDetail(s) : `<p>${backLink(s)}</p>` + V.currentOne(s); };

// ----- stats -----
// Range strip: min–max track, ±1 SD band around the average, median tick, average dot.
function strip(name, st, fmt) {
  if (!st) return '';
  const lo = 0, hi = st.max || 1, X = v => 4 + (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo) * 292;
  const a = st.average, e0 = a - st.sd, e1 = a + st.sd, ln = (x1, y1, x2, y2, c, w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" vector-effect="non-scaling-stroke"/>`;
  const svg = `<svg viewBox="0 0 300 24" preserveAspectRatio="none">
    ${ln(4, 12, X(st.min), 12, 'var(--track)', 2)}${ln(4, 9, 4, 15, 'var(--muted)', 1)}
    ${ln(X(st.min), 12, 296, 12, 'var(--range)', 1.5)}${ln(X(st.min), 4, X(st.min), 20, 'var(--range)', 1.5)}${ln(296, 4, 296, 20, 'var(--range)', 1.5)}
    ${ln(X(e0), 12, X(e1), 12, 'var(--avg)', 1.2)}${e0 >= lo ? ln(X(e0), 8, X(e0), 16, 'var(--avg)', 1.2) : ''}${e1 <= hi ? ln(X(e1), 8, X(e1), 16, 'var(--avg)', 1.2) : ''}
    ${ln(X(st.median), 0, X(st.median), 24, 'var(--median)', 2)}
    <rect x="${X(a) - 2}" y="5" width="4" height="14" fill="var(--avg)"/></svg>`;
  return `<div class="srow" data-tip="${esc(`<b>${name}</b><br>avg ${fmt(st.average)} · med ${fmt(st.median)}<br>min ${fmt(st.min)} · max ${fmt(st.max)} · sd ${fmt(st.sd)}`)}">
    <div class="top"><span>${name}</span><span class="val">avg ${fmt(st.average)} ± ${fmt(st.sd)}</span></div>
    <div style="font-size:11px;position:relative;height:15px">${atTick(X(st.median), `med <b>${fmt(st.median)}</b>`, 'color:var(--median)', true)}</div>${svg}
    <div class="muted" style="font-size:11px;position:relative;height:15px">${atTick(X(st.min), `min ${fmt(st.min)}`, '')}<span style="position:absolute;right:0">max ${fmt(st.max)}</span></div></div>`;
}
// Label placed at a tick, in the SVG's 0–300 frame. Left-aligned labels start at the tick;
// centred ones move to left-aligned near the left edge; both flip to right-aligned near the right edge.
function atTick(x, html, style, leftAligned) {
  const pct = x / 300 * 100;
  const shift = pct > 82 ? '-100%' : leftAligned || pct < 12 ? '0' : '-50%';
  return `<span style="position:absolute;left:${pct}%;transform:translateX(${shift});white-space:nowrap;${style}">${html}</span>`;
}
const lg = body => `<svg width="22" height="12" viewBox="0 0 22 12" style="vertical-align:-2px;margin-right:4px">${body}</svg>`;
const stripLegend = `<div class="legend" style="margin-bottom:8px">
  <span>${lg('<line x1="1.5" y1="6" x2="20.5" y2="6" stroke="var(--range)" stroke-width="1.5"/><line x1="1.5" y1="1" x2="1.5" y2="11" stroke="var(--range)" stroke-width="1.5"/><line x1="20.5" y1="1" x2="20.5" y2="11" stroke="var(--range)" stroke-width="1.5"/>')}min to max</span>
  <span style="color:var(--median)">${lg('<line x1="11" y1="0" x2="11" y2="12" stroke="var(--median)" stroke-width="2"/>')}median</span>
  <span>${lg('<line x1="2" y1="6" x2="20" y2="6" stroke="var(--avg)"/><line x1="2.5" y1="3" x2="2.5" y2="9" stroke="var(--avg)"/><line x1="19.5" y1="3" x2="19.5" y2="9" stroke="var(--avg)"/><rect x="9" y="1" width="4" height="10" fill="var(--avg)"/>')}average ± 1 SD</span></div>`;
// Send-backs by reason, as bars against the most common reason.
function reasonsCard(reasons) {
  const rows = Object.entries(reasons || {}).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '';
  const max = rows[0][1], total = rows.reduce((a, r) => a + r[1], 0);
  return `<div class="card"><h3>Rework reasons · ${total} send-backs</h3>${rows.map(([k, v]) =>
    `<div class="row small" style="margin:4px 0"><span style="width:110px" class="t2">${esc(k)}</span><div style="flex:1">${hbar(v, max, String(v), 'var(--rework)')}</div></div>`).join('')}</div>`;
}
const statsRows = (o, fmt, order) => (order || Object.keys(o)).filter(k => o[k]).map(k => strip(k, o[k], fmt)).join('');
// Bar order, fixed: the colours are validated as neighbours in this order.
const TIMERS = ['blocking-run', 'coding', 'manual-qa', 'dependency-wait',
  'service-wait', 'user-ask'];
let statTab = 'charts';
V.stats = () => {
  if (!past.length) return '<h1>Stats</h1><p class="muted">No completed sprints yet.</p>';
  const T = ST.timing, timed = past.filter(s => s.timing);
  const minFmt = v => fmtMin(v), n2 = v => num(v, 2);
  // One icon per completed sprint, classified as sprint_timing.statistics
  // does: no timing (outline), incomplete (grey), included (coloured).
  const coverage = s => {
    const t = s.timing, n = s.cards_end;
    if (!t || !t.timed_cards) return 'none';
    const whole = t.observed_cards === n && t.timed_cards === n
      && t.final_cards === n && !Object.keys(t.open_timer_minutes || {}).length;
    return whole ? 'included' : 'incomplete';
  };
  const COV = { included: 'Included', incomplete: 'Incomplete timing',
    none: 'No timing' };
  const covIcon = k => `<span class="cov ${k}"></span>`;
  const covBar = `<div class="cicons">${past.map(s => `<span class="cov ${coverage(s)}"
      ${goto(s.sprint)} data-tip="${esc(`${s.alias || '#' + s.sprint}: ${COV[coverage(s)]}`)}"></span>`).join('')}</div>
    <div class="legend" style="margin-top:8px">${Object.entries(COV).map(([k, l]) =>
      `<span>${covIcon(k)} ${l} ${past.filter(s => coverage(s) === k).length}</span>`).join('')}</div>`;
  const tableRows = (title, o, fmt) => `<tr><th colspan="6" style="padding-top:16px">${title}</th></tr>` + Object.entries(o).filter(([, v]) => v).map(([k, v]) =>
    `<tr><td>${k}</td>${['average', 'median', 'min', 'max', 'sd'].map(f => `<td class="n">${fmt(v[f])}</td>`).join('')}</tr>`).join('');
  const one = (k, v) => ({ [k]: v });
  if (statTab === 'table') return head() + `<div class="card scroll"><table><thead><tr><th>Metric</th><th class="n">Avg</th><th class="n">Med</th><th class="n">Min</th><th class="n">Max</th><th class="n">SD</th></tr></thead><tbody>
    ${tableRows('Delivery', { Hours: ST.hours, 'Cards start': ST.cards_start, 'Cards end': ST.cards_end, 'Points start': ST.points_start, 'Points end': ST.points_end, 'Velocity (pts/h)': ST.velocity }, n2)}
    ${tableRows('Rework', one('Rework count', T.rework.count), n2)}
    ${tableRows('Totals', { Active: T.active_minutes_total, 'Time spent': T.execution_minutes_total }, minFmt)}
    ${tableRows('Active', T.active_minutes, minFmt)}${tableRows('State residence', Object.fromEntries(Object.entries(T.residence_minutes).filter(([k]) => !TERMINAL.has(k))), minFmt)}${tableRows('Time spent', T.execution_minutes, minFmt)}</tbody></table></div>`;
  return head() + `
  <h2>Distributions per sprint</h2><div style="margin:-2px 0 12px">${stripLegend}</div>
  <div class="dist"><div class="stack">
    <div class="card"><h3>Delivery</h3><div class="strip">${strip('Hours', ST.hours, v => fmtH(v))}${strip('Cards start', ST.cards_start, n2)}${strip('Cards end', ST.cards_end, n2)}
      ${strip('Points start', ST.points_start, n2)}${strip('Points end', ST.points_end, n2)}${strip('Velocity pts/h', ST.velocity, n2)}${strip('Rework count', T.rework.count, n2)}${strip('Rework time', T.rework.minutes, minFmt)}</div></div>
    <div class="card"><h3>State residence</h3><div class="strip">${statsRows(T.residence_minutes, minFmt, ['Backlog', 'Todo', 'In Progress', 'Verifying'])}
      ${strip('Active = In Progress + Verifying', T.active_minutes_total, minFmt)}</div></div>
    </div>
    <div class="stack"><div class="card"><h3>Time spent by timer</h3><div class="strip">${strip('All timers', T.execution_minutes_total, minFmt)}
      ${statsRows(T.execution_minutes, minFmt, Object.keys(T.execution_minutes).sort((a, b) => T.execution_minutes[b].average - T.execution_minutes[a].average))}</div></div>
    ${reasonsCard(T.rework.reasons)}</div>
  </div>
  <h2>Per sprint, oldest to newest</h2>
  ${POINTS ? `  <div class="card"><h3>Points: delivered against the original scope</h3>${stackChart({ data: past, start: d => d.points_start, end: d => d.points_end, kind: 'points',
    tipFn: d => tipHead(d) + `${d.points} pts · cards ${d.cards}` })}</div>
` : ''}  <div class="card" style="margin-top:12px"><h3>Cards: delivered against the original scope</h3>${stackChart({ data: past, start: d => d.cards_start, end: d => d.cards_end, kind: 'cards',
    tipFn: d => tipHead(d) + `${d.cards} cards${POINTS ? ` · ${d.points} pts` : ''}` })}</div>
  ${POINTS ? `  <div class="card" style="margin-top:12px"><h3>Velocity <span class="muted small">(pts/h, log₂ scale)</span></h3>${heatLegend}${colChart({ data: past, log: true, fmt: v => num(v, 2),
    stacks: [{ label: 'pts/h', color: d => heatV(d.velocity), get: d => d.velocity }], ref: MEDV, refLabel: `median ${num(MEDV, 2)}`, tipFn: d => tipHead(d) + `${num(d.velocity, 2)} pts/h` })}</div>` : ''}
  <div class="card" style="margin-top:12px"><h3>Duration <span class="muted small">(log₂ scale)</span></h3>${colChart({ data: past, log: true, lo: 0.125, fmt: v => v < 1 ? Math.round(v * 60) + 'm' : num(v, 0) + 'h',
    stacks: [{ label: 'hours', color: 'var(--dur)', get: d => d.hours }], ref: ST.hours.median, refLabel: `median ${fmtH(ST.hours.median)}`, tipFn: d => tipHead(d) + d.elapsed })}</div>
  <div class="card" style="margin-top:12px"><h3>Time spent by timer <span class="muted small">(card-hours)</span></h3>${colChart({ data: timed, fmt: v => num(v, 0) + 'h',
    stacks: [...TIMERS.map((k, i) => ({ label: k, color: timerColor(k), get: d => (d.timing.execution_minutes[k] || 0) / 60 })),
      { label: 'other', color: 'var(--t-other)', get: d => Object.entries(d.timing.execution_minutes).filter(([k]) => !TIMERS.includes(k)).reduce((a, x) => a + x[1], 0) / 60 }],
    tipFn: d => tipHead(d) + Object.entries(d.timing.execution_minutes).map(([k, v]) => `${k} ${fmtMin(v)}`).join('<br>') })}</div>
  <div class="card" style="margin-top:12px"><h3>Active time <span class="muted small">(card-hours)</span></h3>${colChart({ data: timed, fmt: v => num(v, 0) + 'h',
    stacks: [{ label: 'In Progress', color: 'var(--st-prog)', get: d => (d.timing.active_minutes['In Progress'] || 0) / 60 }, { label: 'Verifying', color: 'var(--st-verify)', get: d => (d.timing.active_minutes['Verifying'] || 0) / 60 }],
    tipFn: d => tipHead(d) + `In Progress ${fmtMin(d.timing.active_minutes['In Progress'])}<br>Verifying ${fmtMin(d.timing.active_minutes['Verifying'])}` })}</div>
  <div class="card" style="margin-top:12px"><h3>Rework events</h3>${colChart({ data: timed, h: 160, fmt: v => num(v, 0), whole: true,
    stacks: [{ label: 'rework', color: 'var(--rework)', get: d => d.timing.rework_count }], tipFn: d => tipHead(d) + `${d.timing.rework_count} rework on ${d.timing.reworked_cards} cards` })}</div>
  <h2>Timing coverage</h2><div class="card"><h3>${past.length} completed sprints</h3>${covBar}</div>`;
  function head() { return `<h1>Stats</h1><p class="muted">Everything from <span class="mono">plane-proj sprints stats</span>, plus per-sprint series from <span class="mono">sprints list past</span>. Click a column to open its sprint.</p>
    <div class="tabs"><button class="${statTab === 'charts' ? 'on' : ''}" onclick="statTab='charts';render()">Charts</button><button class="${statTab === 'table' ? 'on' : ''}" onclick="statTab='table';render()">Table</button></div>`; }
};

// ===== router =====
function render() {
  const { view, arg, from } = route();
  const fn = { '': V.overview, current: () => V.current(+arg), planned: V.planned, past: V.past, stats: V.stats, sprint: () => V.sprint(+arg) }[view || ''] || V.overview;
  $('#app').innerHTML = fn();
  updateScrollers();
  placeBusy();
  // A narrow screen scrolls the sprint tabs; keep the open one in view.
  document.querySelector('.stabs a.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  // A sprint page highlights the page it was opened from.
  const sec = view === 'sprint' ? (from ? from.split('/')[1] || '' : { current: 'current', planned: 'planned', completed: 'past' }[byId[+arg]?.status]) : (view || '');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href').split('/')[1] === sec));
  $('#navsel').value = '#/' + (sec || '');
}
// Tabs while they fit beside the logo, a minimum of the project name, and the theme toggle; a dropdown otherwise.
const navW = $('#nav').offsetWidth;
function fitNav() {
  const bar = $('.bar'), cs = getComputedStyle(bar), gap = parseFloat(cs.columnGap) || 0;
  const room = bar.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - $('.logo').offsetWidth - 6
    - $('#theme').offsetWidth - 4 * gap - 96;
  bar.classList.toggle('compact', room < navW);
}
new ResizeObserver(fitNav).observe($('.bar')); fitNav();
// Sideways rows show an arrow on each side that has more to see, and a
// click moves by about one card.
function updateScrollers() {
  document.querySelectorAll('.scroller').forEach(box => {
    const row = box.querySelector('.flight');
    const max = row.scrollWidth - row.clientWidth;
    box.querySelector('.sc-left').hidden = row.scrollLeft <= 1;
    box.querySelector('.sc-right').hidden = row.scrollLeft >= max - 1;
  });
}
window.scrollRow = (button, direction) => {
  const row = button.parentElement.querySelector('.flight');
  const card = row.firstElementChild?.getBoundingClientRect().width || row.clientWidth;
  row.scrollBy({ left: direction * (card + 12), behavior: 'smooth' });
};
// Scroll events do not bubble, so listen in the capture phase.
document.addEventListener('scroll', e => { if (e.target.classList?.contains('flight')) updateScrollers(); }, true);
addEventListener('resize', updateScrollers);
// Elapsed time on the Current page moves with the clock, not with reloads.
setInterval(() => document.querySelectorAll('[data-elapsed]').forEach(e => {
  e.textContent = fmtH((Date.now() - Date.parse(e.dataset.elapsed)) / 36e5); }), 30000);
addEventListener('hashchange', () => { if (DATA) { render(); scrollTo(0, 0); if (isCurrentOpen() && Date.now() - lastTimingFetch >= 60000) { lastTimingFetch = Date.now(); refresh(); } } });
$('#theme').onclick = () => { const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
$('#app').innerHTML = `<div style="padding-top:4px">${sk('180px', 26)}</div><div style="margin:14px 0 18px">${sk('240px', 14)}</div>
  <div class="grid g4">${`<div class="card kpi">${sk('60px', 30)}<div style="margin-top:8px">${sk('70%', 12)}</div></div>`.repeat(4)}</div>`;
const getJSON = url => fetch(url, { cache: 'no-store' })
  .then(r => r.json().then(body => { if (!r.ok) throw new Error(body.error || r.statusText); return body; }));
// Live view: poll the register's change marker (no Plane request) and reload the
// data when it moves. Typing in the filter box defers the redraw.
// The first paint uses the register alone (milliseconds); the full payload,
// which reads Plane, replaces it. Later refreshes keep the current view until
// the full payload arrives, so nothing flickers back to placeholders.
// While a Current page is open, timing is refetched from Plane about once a minute.
let version = null;
let lastTimingFetch = Date.now();
// "Updating from Plane…" shows beside the page heading while any Plane
// read is outstanding, including the Planned page's readiness report.
const busyEl = $('#busy');
let pending = 0, failure = '';
function showBusy() {
  busyEl.classList.toggle('failed', !pending && Boolean(failure));
  busyEl.textContent = pending ? 'Updating from Plane…' : failure;
}
const busyStart = () => { pending++; failure = ''; showBusy(); };
const busyEnd = () => { pending = Math.max(0, pending - 1); showBusy(); };
const busyFail = message => { failure = message; showBusy(); };
function placeBusy() {
  const heading = $('#app h1');
  if (heading) heading.append(busyEl); else $('#app').prepend(busyEl);
}
function show(data) {
  const y = scrollY; boot(data);
  if (document.activeElement?.id !== 'q') { render(); scrollTo(0, y); }
}
function refresh() {
  busyStart();
  READINESS = null; readinessState = 'idle';
  const first = DATA ? Promise.resolve() : getJSON('api/sprints/local').then(show);
  return first.then(() => getJSON('api/sprints')).then(show).finally(busyEnd);
}
function isCurrentOpen() {
  const { view, arg } = route();
  return view === 'current' || (view === 'sprint' && byId[+arg]?.status === 'current');
}
function poll() {
  let wait = 2000;
  getJSON('api/version')
    .then(v => {
      const now = Date.now();
      if (v.version !== version) {
        version = v.version;
        lastTimingFetch = now;
        return refresh();
      }
      if (isCurrentOpen() && now - lastTimingFetch >= 60000) {
        lastTimingFetch = now;
        return refresh();
      }
    })
    .catch(e => {
      // Retry later rather than every poll: a failing Plane read is slow.
      version = null; wait = 15000;
      if (DATA) busyFail(`Plane update failed: ${e.message}`);
      else $('#app').innerHTML = `<div class="note">Could not load sprints: ${esc(e.message)}</div>`;
    })
    .finally(() => setTimeout(poll, wait));
}
poll();
</script>
</body>
</html>
