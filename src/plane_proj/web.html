<!doctype html>
<html lang="en">

<title>Sprints</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text: #0b0b0b; --text-2: #52514e; --muted: #85837d; --accent: #2f3a48;
  /* State colours mean card state and nothing else: blue, orange and green appear nowhere below. */
  --st-todo: #9c9a93; --st-prog: #2a78d6; --st-verify: #ffcc00; --st-done: #1baf7a; --st-cancel: #cfcdc6;
  /* Timers in bar order, one lightness and saturation for all: green for
     coding (value), red hues for time lost. The order is validated for
     colour-blind separation; grey folds the rest. */
  --t1: #b7698f; --t2: #7e903e; --t3: #a36faf; --t4: #b37736; --t5: #857ac4;
  --t6: #bf696a; --t-other: #aab2bd;
  --chain: #6f8a2e;
  --parallel: #3f7e44; --parallel-bg: rgba(63, 126, 68, 0.12);
  /* Neutral slate for counts and plans; violet means duration; hot pink
     is the average in stats strips. */
  --scope-o: #6f7b8a; --slate-2: #aab2bd; --dial-track: #d9dde3;
  --dur: #4a3aa7; --rework: #a3172b; --avg: #e0287d;
  /* Velocity heat, slow to fast: peach, orange, red, deep red. No yellow:
     yellow means Verifying. */
  --heat-0: #f2c4a4; --heat-1: #ee8636; --heat-2: #e2593a; --heat-3: #b81f2f;
  --warn: #d13b3b; --unclear: #b8621b; --overlap: #7b42bc; --grid: #e9e8e4; --track: #ecebe7; --sk-hi: #fcfcfb; --range: #6f6d67; --median: #4a3aa7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
    --text: #fff; --text-2: #c3c2b7; --muted: #8d8b84; --accent: #d4d9e0;
    --st-todo: #77756f; --st-prog: #3987e5; --st-verify: #ffd23f; --st-done: #199e70; --st-cancel: #4a4945;
    --t1: #c4759c; --t2: #8a9c4a; --t3: #b07bbc; --t4: #c08343; --t5: #9186d1;
    --t6: #cd7576; --t-other: #59616c;
    --chain: #9bb352;
    --parallel: #68ad6e; --parallel-bg: rgba(104, 173, 110, 0.15);
    --scope-o: #8a94a1; --slate-2: #59616c; --dial-track: #3a3f47;
    --dur: #9085e9; --rework: #e5484d; --avg: #f0509a;
    --heat-0: #c79070; --heat-1: #e77a2c; --heat-2: #e5553c; --heat-3: #ff3b4a;
    --warn: #ef6b6b; --unclear: #e58d3c; --overlap: #c084fc; --grid: #2a2a27; --track: #2a2a27; --sk-hi: #34342f; --range: #a3a196; --median: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #33332f;
  --text: #fff; --text-2: #c3c2b7; --muted: #8d8b84; --accent: #d4d9e0;
  --st-todo: #77756f; --st-prog: #3987e5; --st-verify: #ffd23f; --st-done: #199e70; --st-cancel: #4a4945;
  --t1: #c4759c; --t2: #8a9c4a; --t3: #b07bbc; --t4: #c08343; --t5: #9186d1;
  --t6: #cd7576; --t-other: #59616c;
  --chain: #9bb352;
  --parallel: #68ad6e; --parallel-bg: rgba(104, 173, 110, 0.15);
  --scope-o: #8a94a1; --slate-2: #59616c; --dial-track: #3a3f47;
  --dur: #9085e9; --rework: #e5484d; --avg: #f0509a;
  --heat-0: #c79070; --heat-1: #e77a2c; --heat-2: #e5553c; --heat-3: #ff3b4a;
  --warn: #ef6b6b; --unclear: #e58d3c; --overlap: #c084fc; --grid: #2a2a27; --track: #2a2a27; --sk-hi: #34342f; --range: #a3a196; --median: #9085e9;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
main a { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 2px; } main a:hover { text-decoration-color: currentColor; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.muted { color: var(--muted); } .t2 { color: var(--text-2); } .small { font-size: 12px; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.bar { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 16px; height: 52px; position: relative; }
/* Square word logo: "plane" over "proj". */
.logo { flex: none; display: flex; flex-direction: column; justify-content: center; width: 38px; height: 38px; padding: 0 4px;
  margin-right: 6px; border-radius: 6px; background: #2b2f36; color: #fff; font-weight: 800;
  box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px rgba(0,0,0,.08); font-size: 12px; line-height: .98; letter-spacing: -.02em; }
.logo:hover { text-decoration: none; }
.proj { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--text-2); }
button { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
nav { display: flex; gap: 2px; flex: none; }
#navsel { display: none; flex: none; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
.bar.compact nav { display: none; } .bar.compact #navsel { display: block; }
/* Beside the page heading while Plane is being read, with a spinner. */
.busy { display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; vertical-align: middle; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 400; color: var(--text-2); }
.busy::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--text-2); animation: spin .8s linear infinite; }
.busy.failed { color: var(--warn); } .busy.failed::before { display: none; }
.busy:empty { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .busy::before { animation: none; } }
nav a { padding: 6px 10px; border-radius: 6px; color: var(--text-2); white-space: nowrap; }
nav a.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
nav a:hover { text-decoration: none; background: var(--surface-2); }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 28px 0 10px; } h3 { font-size: 14px; margin: 0 0 8px; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card.link { cursor: pointer; } .card.link:hover { border-color: var(--accent); }
.kpis { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.kpis .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; min-width: 96px; }
.kpis .kpi .v { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpis .kpi .l { font-size: 11.5px; color: var(--text-2); }
.kpi .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text-2); font-size: 12.5px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.alias { font-weight: 600; color: var(--text); }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.state::before { font-size: 26px; line-height: 1; }
.state.start { color: var(--text); } .state.start::before { content: "🚀"; }
.state.overlap { color: var(--overlap); } .state.overlap::before { content: "⚠️"; }
.state.unknown { color: var(--muted); } .state.unknown::before { content: "❓"; }
.state.notready { color: var(--muted); } .state.notready::before { content: "⏳"; }
.unknown { color: var(--text); font-weight: 600; } .unknown::before { content: "? "; color: var(--muted); font-weight: 700; }
.plan-table th, .plan-table td { vertical-align: top; padding: 10px; }
.plan-table td.pos { font-family: ui-monospace, monospace; color: var(--muted); font-size: 16px; text-align: center; width: 36px; }
.plan-table tbody tr:last-child td { border-bottom: 0; }
.info { position: relative; cursor: help; color: var(--muted); font-weight: 400; margin-left: 4px; }
.info .pop { display: none; position: absolute; left: 0; top: 22px; z-index: 5; width: 520px; max-width: 80vw; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px 12px; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; font-weight: 400; color: var(--text-2); white-space: normal; font-size: 12.5px; }
.info:hover .pop, .info:focus .pop { display: grid; }
svg a { cursor: pointer; text-decoration: none; }
svg a:hover rect { stroke: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .sp { flex: 1; }
.goal { color: var(--text-2); margin: 4px 0 0; max-width: 900px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legend.compact { font-size: 11px; gap: 8px; }
.legend.compact i { width: 8px; height: 8px; margin-right: 3px; }
.legend i.hollow, .board .colh i.hollow { background: none !important; border: 1px dashed var(--muted); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
td.n, th.n { text-align: right; }
tbody tr.link { cursor: pointer; } tbody tr.link:hover { background: var(--surface-2); }
.scroll { overflow-x: auto; }
/* bars */
.hb { display: flex; align-items: center; gap: 8px; min-width: 120px; }
/* No track: these bars compare sizes; none of them is progress toward a total. */
.hb .track { flex: 1; height: 10px; position: relative; }
.hb .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 3px 3px 0; }
.hb .lbl { font-size: 11.5px; color: var(--text-2); white-space: nowrap; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
/* state bar with embedded numbers */
.sbar { display: flex; align-items: center; gap: 10px; }
.sbar .tot { font-weight: 650; font-size: 18px; white-space: nowrap; }
/* Points as dots: one dot per point, never wider than 10 px. */
.dots { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.hollow { border: 1px dashed var(--muted); }
.dot.ring { border: 1.5px solid var(--scope-o); }
.cstart { position: relative; align-self: stretch; margin: -6px 1px; border-left: 2px dashed var(--text); }
.cstart b { position: absolute; top: -16px; left: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--text-2); }
.pmark { align-self: stretch; width: 0; margin: -4px 2px; border-left: 2px dashed var(--text); position: relative; }
.pmark b { position: absolute; top: -17px; left: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--text-2); }
/* card icons */
.cicons { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.ci { width: 14px; height: 19px; border-radius: 3px; border: 1px solid rgba(0,0,0,.18); position: relative; }
.ci::after { content: ""; position: absolute; left: 3px; right: 3px; top: 4px; height: 2px; background: rgba(255,255,255,.65); box-shadow: 0 4px 0 rgba(255,255,255,.65); border-radius: 1px; }
.ci.big { width: 22px; height: 30px; border-radius: 4px; }
.ci.big::after { left: 4px; right: 4px; top: 6px; height: 3px; box-shadow: 0 6px 0 rgba(255,255,255,.65); }
.ci.d { background: var(--st-done); }
.ci.v::after { background: rgba(0,0,0,.45); box-shadow: 0 4px 0 rgba(0,0,0,.45); }
.ci.big.v::after { box-shadow: 0 6px 0 rgba(0,0,0,.45); } .ci.r { background: none; border: 1px dashed var(--muted); }
.ci.r::after { background: var(--muted); box-shadow: 0 4px 0 var(--muted); } .ci.big.r::after { box-shadow: 0 6px 0 var(--muted); }
.ci.plain { background: var(--surface-2); border-color: var(--muted); }
.ci.plain::after { background: var(--muted); box-shadow: 0 4px 0 var(--muted); }
.ci.u { border-style: dashed; }
.ci.unk { border-color: var(--unclear); border-style: dashed; }
.ci.unk::after { background: var(--unclear); box-shadow: 0 4px 0 var(--unclear); }
.ci.big.unk::after { box-shadow: 0 6px 0 var(--unclear); }
.ci.go { border-color: var(--parallel); }
.ci.go::after { background: var(--parallel); box-shadow: 0 4px 0 var(--parallel); }
.ci.big.go::after { box-shadow: 0 6px 0 var(--parallel); }
.ci.b { border-color: var(--warn); }
.ci.b::after { background: var(--warn); box-shadow: 0 4px 0 var(--warn); }
.ci.big.b::after { box-shadow: 0 6px 0 var(--warn); }
/* one big board */
.board { display: grid; grid-template-columns: repeat(5, minmax(170px, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: auto; height: 460px; grid-template-rows: auto 1fr; }
/* The board has one fixed height, loading or loaded, so nothing below it
   moves; a long board scrolls inside its frame with headers in view. */
.board .colh { position: sticky; top: 0; z-index: 1; padding: 10px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--border); background: var(--surface-2); display: flex; gap: 6px; align-items: center; }
.board .colh i { width: 8px; height: 8px; border-radius: 50%; }
.board .colb { padding: 10px; min-height: 160px; }
.board .colh + .colh, .board .colb + .colb { border-left: 1px solid var(--border); }
.wi { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
.wi.r { border-left: 3px dashed var(--muted) !important; }
.wi .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 11.5px; color: var(--text-2); }
.flag { color: var(--warn); font-weight: 600; }
.prose { white-space: pre-wrap; color: var(--text-2); }
.note { border-left: 3px solid var(--warn); background: var(--surface); padding: 8px 12px; border-radius: 6px; font-size: 12.5px; color: var(--text-2); margin-bottom: 16px; }
/* planned rows */
.plan { display: grid; grid-template-columns: 36px minmax(260px, 2.2fr) minmax(130px, 1fr) minmax(150px, 1.2fr) minmax(150px, 1.2fr); gap: 0 16px; align-items: stretch; }
.plan > div { padding: 12px 0; border-bottom: 1px solid var(--border); min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.plan .hd { font-size: 12px; color: var(--text-2); font-weight: 600; padding: 6px 0; }
.plan .pos { font-family: ui-monospace, monospace; color: var(--muted); font-size: 16px; text-align: center; }
.plan .ttl { cursor: pointer; } .plan .ttl:hover .tt { color: var(--accent); }
.plan .gl { color: var(--text-2); font-size: 12.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* Narrow: each sprint stacks in column 2 and its divider follows its last cell; the position spans the stack. */
@media (max-width: 760px) { .plan { grid-template-columns: 28px 1fr; } .plan > div { border-bottom: 0; }
  .plan .hd { border-bottom: 1px solid var(--border); } .plan .hd.wide { display: none; }
  .plan .pos { grid-row: span 4; justify-content: flex-start; border-bottom: 1px solid var(--border); }
  .plan .ttl { grid-column: 2; padding-bottom: 8px; } .plan .wide { grid-column: 2; padding: 0 0 8px; } .plan .wide:empty { padding: 0; }
  .plan .wide.last { padding-bottom: 12px; border-bottom: 1px solid var(--border); } }
/* stats strips */
.srow { padding: 6px 0 4px; border-bottom: 1px solid var(--border); }
.srow .top { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.srow .val { margin-left: auto; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; text-align: right; }
.srow svg { width: 100%; height: 22px; display: block; }
.dist { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.dist .stack { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 760px) { .dist { grid-template-columns: 1fr; } }
/* skeleton placeholders: same box as the content they stand for */
.sk { display: block; border-radius: 4px; background: linear-gradient(90deg, var(--surface-2) 30%, var(--sk-hi) 50%, var(--surface-2) 70%); background-size: 300% 100%; animation: sk 1.3s ease-in-out infinite; }
span.sk.inline { display: inline-block; vertical-align: middle; }
.ci.sk { border: 0; } .ci.sk::after { display: none; }
@keyframes sk { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--text-2); font-size: 11px; }
.chart .gl { stroke: var(--grid); }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; display: none; max-width: 300px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.tabs button.on { background: var(--accent); color: var(--surface); border-color: var(--accent); }
/* one tab per running sprint */
.stabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin: 12px 0 18px; }
.stabs a { padding: 8px 12px; border-radius: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-2); white-space: nowrap; text-decoration: none; }
.stabs a:hover { text-decoration: none; color: var(--text); }
.stabs a.on { background: none; border-bottom-color: var(--text); color: var(--text); font-weight: 600; }
/* velocity dial */
.dial { display: block; overflow: visible; }
.gwrap { height: 34px; margin-top: 8px; }
/* Current: the four tiles as 2 x 2 on the left, points and cards on the
   right; one column on narrow screens. */
.cur-top { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.cur-top > .card { margin-top: 0 !important; }
.quad { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .cur-top { grid-template-columns: 1fr; } }
/* A running timer: a hollow extension in its timer's colour. */
.openseg { border: 1.5px solid; border-radius: 2px; }
/* Elapsed tile: when the sprint started, as a digital clock and a date. */
.clock { text-align: right; }
.clock .t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 22px; font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clock .d { font-size: 12px; color: var(--text-2); }
/* Boxes inside a box, such as Overview's sprints and charts. */
.card.sub { background: var(--bg); }
/* In flight: up to three sprints side by side, more scroll sideways; a
   phone stacks them. */
.flight { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(calc((100% - 24px) / 3), 1fr); gap: 12px; overflow-x: auto; }
@media (max-width: 760px) { .flight { grid-auto-flow: row; grid-auto-columns: auto; } }
/* Graph focus: a hovered sprint's links stand out, the others fade. */
.dag a, .dag a:hover { text-decoration: none; }
.dag .link { transition: opacity .12s; }
.dag.focus .link { opacity: .15; }
.dag.focus .link.hl { opacity: 1; }
.dag.focus .link.hl path:first-child { stroke-width: 4; }
.dag.focus .link.dep.hl:not(.crit) path:first-child { stroke: var(--text); }
.dag.focus .link.dep.hl:not(.crit) path + path { fill: var(--text); }
.dag.focus .link.dep.hl path + path { transform-box: fill-box; transform-origin: left center; transform: scale(1.5); }
/* Arrows over a sideways row's edges, shown only where it has more. */
.scroller { position: relative; }
.sc { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 34px; height: 34px; padding: 0; border-radius: 50%;
  font-size: 22px; line-height: 1; background: var(--surface); box-shadow: 0 1px 6px rgba(0,0,0,.18); }
.sc:hover { background: var(--surface-2); }
.sc[hidden] { display: none; }
.sc-left { left: -10px; } .sc-right { right: -10px; }
.kpi.side { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi.side > :first-child { flex: none; }
/* The dial shrinks in a narrow tile instead of overflowing it. */
.kpi.side .dial { flex: 0 1 auto; min-width: 0; max-width: 60%; height: auto; }
.kpi .v { white-space: nowrap; }
/* Without room beside the figure, a tile's table goes under it. */
.kpi.side:has(table.mini), .kpi.side:has(.clock) { flex-wrap: wrap; }
table.mini { width: auto; font-size: 11.5px; color: var(--text-2); border-collapse: collapse; }
table.mini td { padding: 0 0 1px; border: 0; white-space: nowrap; }
table.mini td + td { padding-left: 10px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
.split { display: flex; gap: 2px; flex: 0 1 72px; min-width: 24px; height: 8px; margin-left: auto; }
.split i { border-radius: 2px; min-width: 2px; }
.gsm { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 12.5px; }
/* original scope: a thin dashed line across the delivered row */
/* timing coverage: one icon per sprint */
.cov { display: inline-block; width: 14px; height: 14px; border-radius: 3px; cursor: pointer; vertical-align: -2px; }
.cov.included { background: var(--dur); } .cov.incomplete { background: var(--slate-2); }
.cov.none { border: 1px solid var(--muted); }
.legend .cov { width: 10px; height: 10px; cursor: default; }
.otick { align-self: stretch; width: 0; margin: -3px -2px; border-left: 1px dashed var(--text); }
.legend i.heatlg { width: 40px; background: linear-gradient(90deg, var(--heat-0), var(--heat-1), var(--heat-2), var(--heat-3)); }
.nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details summary { cursor: pointer; color: var(--text-2); }
@media (max-width: 640px) { .bar { gap: 8px; } }
@media (max-width: 760px) { .hide-sm { display: none; } }
@media (max-width: 760px) { .plan-table th, .plan-table td { padding: 8px 5px; }
  .plan-table .state { font-size: 13px; } }
.size { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
.size .sline { display: flex; align-items: center; gap: 12px; }
.size .sline + .sline { margin-top: 12px; }
.size .sline > span { white-space: nowrap; color: var(--text-2); }
.size .est { min-width: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.size .est .v { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; }
.size .est .l { color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
@media (max-width: 560px) { .size { grid-template-columns: 1fr; } }
.verdict .state { font-size: 18px; } .verdict .state::before { font-size: 34px; }
.verdict p, .rpanel p { margin: 8px 0 0; color: var(--text-2); font-size: 13px; }
.rpanel h3 { margin: 0 0 8px; font-size: 13px; color: var(--text-2); font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
a.pill { text-decoration: none; color: var(--text); }
a.pill.clash { border-color: var(--overlap); color: var(--overlap); font-weight: 600; }
a.pill.run { background: var(--st-prog); border-color: var(--st-prog); color: #fff; font-weight: 600; }
.mark { font-size: 30px; font-weight: 700; line-height: 1; margin-right: 8px; }
.mark.yes { color: var(--st-done); } .mark.no { color: var(--warn); } .mark.maybe { color: var(--unclear); }
.clist { padding: 4px 6px; }
.clist td { vertical-align: top; padding: 10px; font-size: 13px; }
.clist tbody tr:last-child td { border-bottom: 0; }
.clist td.ref { white-space: nowrap; }
.clist ul { margin: 0; padding-left: 16px; } .clist li { margin: 1px 0; }
/* On a phone each card is a block: its title, then labelled lines. */
@media (max-width: 760px) {
  .clist thead { display: none; }
  .clist tr { display: block; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .clist tbody tr:last-child { border-bottom: 0; }
  .clist td { display: block; padding: 2px 0; border: 0; }
  .clist td.empty { display: none; }
  .clist td[data-k]::before { content: attr(data-k); display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
}
.clist .flag { color: var(--warn); font-size: 12px; font-weight: 600; margin-right: 10px; }
.clist .flag.u { color: var(--muted); font-style: italic; font-weight: 300; }
.clist .flag.unk { color: var(--unclear); font-style: italic; font-weight: 300; }
ul.paths { margin: 0; padding-left: 16px; }
ul.paths li { overflow-wrap: anywhere; }
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/" aria-label="plane-proj overview"><span>plane</span><span>proj</span></a>
  <span class="proj" id="projname"></span>
  <nav id="nav">
    <a href="#/">Overview</a><a href="#/current">Current</a><a href="#/planned">Planned</a>
    <a href="#/past">Past</a><a href="#/stats">Stats</a>
  </nav>
  <select id="navsel" aria-label="Page" onchange="location.hash = this.value">
    <option value="#/">Overview</option><option value="#/current">Current</option><option value="#/planned">Planned</option>
    <option value="#/past">Past</option><option value="#/stats">Stats</option>
  </select>
  <span class="sp"></span>
  <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  <span class="busy" id="busy" role="status" aria-live="polite"></span>
</div></header>
<main id="app"></main>
<div class="tip" id="tip"></div>
<script>
// ===== data =====
// Filled by boot() from /api/sprints; every view reads these.
let DATA, PARTIAL, L, ST, SNAP, PROJECT, POINTS, current, planned, past, byId, MEDV;
function boot(data) {
  // A partial payload is the register alone: Plane-only facts arrive next.
  DATA = data; PARTIAL = !!data.partial; L = data.listing; ST = L.stats || {}; SNAP = new Date(data.generated_at);
  PROJECT = data.project.key; POINTS = data.estimates;
  current = L.current || [];
  planned = [...(L.planned || [])].sort((a, b) => a.position - b.position);
  past = [...(L.past || [])].sort((a, b) => new Date(a.started) - new Date(b.started));
  byId = Object.fromEntries([...current, ...planned, ...past].map(s => [s.sprint, s]));
  MEDV = POINTS ? ST.velocity?.median ?? null : null; // assumed velocity for planned estimates
  document.title = `${PROJECT} sprints`;
  $('#projname').textContent = data.project.name ? `${PROJECT} · ${data.project.name}` : PROJECT;
}
const cardsFor = s => DATA.cards[s.sprint] || [];
// Skeletons take the exact place of what the full payload fills in.
const sk = (width, height, style = '') => `<span class="sk" style="width:${width};height:${height}px;${style}"></span>`;
const skInline = (width, height = 12) => `<span class="sk inline" style="width:${width};height:${height}px"></span>`;
const skIcons = (n, big) => `<div class="cicons">${`<span class="ci sk${big ? ' big' : ''}"></span>`.repeat(Math.max(n || 0, 1))}</div>`;
const skStateBar = () => `<div class="sbar">${sk('60%', 10)}<span class="sp"></span><span class="tot">${skInline('52px', 20)}</span></div>`;
// Open blockers of a card, shown only while the card itself is unfinished.
function waitsOn(c) {
  const open = (c.blocked_by || []).filter(b => !TERMINAL.has(b.state));
  if (!open.length || TERMINAL.has(c.state)) return '';
  return `<div class="meta"><span class="flag" data-tip="Blocked until these are Done">waits on ${open.map(b => `${esc(b.ref)} (${esc(b.state)})`).join(', ')}</span></div>`;
}
const reasonText = r => Object.entries(r || {}).map(([k, v]) => `${k} ${v}`).join(' · ');

// ===== helpers =====
const $ = q => document.querySelector(q);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtMin = m => { if (m == null) return '—'; m = Math.round(m); if (m < 60) return m + 'm';
  const h = Math.floor(m / 60); if (h < 48) return h + 'h ' + String(m % 60).padStart(2, '0') + 'm'; return Math.floor(h / 24) + 'd ' + (h % 24) + 'h'; };
const fmtH = h => h == null ? '—' : fmtMin(h * 60);
const num = (v, d = 1) => v == null ? '—' : String(+(+v).toFixed(d));
const ago = t => { const m = (SNAP - new Date(t)) / 6e4;
  if (m < 60) return Math.round(m) + ' min ago'; if (m < 60 * 36) return Math.round(m / 60) + ' h ago'; return Math.round(m / 1440) + ' days ago'; };
const fullDate = t => new Date(t).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const label = s => s.alias ? `<span class="alias">${esc(s.alias)}</span> <span class="muted mono">#${s.sprint}</span>` : `<span class="alias">#${s.sprint}</span>`;
const elapsedH = s => (SNAP - new Date(s.started)) / 36e5;
const median = a => { const v = a.filter(x => x != null).sort((x, y) => x - y); return v[Math.floor(v.length / 2)]; };
const TERMINAL = new Set(['Done', 'Cancelled']); // residence in a terminal state is not delivery time
const STATES = ['Todo', 'In Progress', 'Verifying', 'Done', 'Cancelled'];
// Progress reads left to right like a bar filling up: finished work first.
const PROGRESS = ['Done', 'Verifying', 'In Progress', 'Todo', 'Cancelled'];
const byProgress = cards => [...cards].sort((a, b) => PROGRESS.indexOf(a.state) - PROGRESS.indexOf(b.state));
const stC = { 'Todo': 'var(--st-todo)', 'In Progress': 'var(--st-prog)', 'Verifying': 'var(--st-verify)', 'Done': 'var(--st-done)', 'Cancelled': 'var(--st-cancel)' };
// Cancelled draws hollow and dashed, as Past draws a card not delivered.
const swatch = st => st === 'Cancelled' ? 'class="hollow"' : `style="background:${stC[st]}"`;
// The sprint's own Plane cycle, which lists only its cards.
const planeLink = s => {
  const url = DATA.cycle_urls?.[s.sprint ?? s.sprint_id];
  return url ? `<a class="small" href="${esc(url)}" target="_blank"
    rel="noopener">Open in Plane ↗</a>` : '';
};
// Routes are #/view/arg?from=/origin. A sprint opened from a page carries
// that page in `from`, so its back link returns there.
const route = () => {
  const [path, query = ''] = (location.hash || '#/').slice(1).split('?');
  const [, view = '', arg] = path.split('/');
  return { path: path || '/', view, arg, from: new URLSearchParams(query).get('from') };
};
const sprintHref = id => `#/sprint/${id}?from=${encodeURIComponent(route().from && route().view === 'sprint' ? route().from : route().path)}`;
window.openSprint = id => { location.hash = sprintHref(id); };
const goto = id => `onclick="openSprint(${id})"`;
const PAGE_NAMES = { '': 'Overview', current: 'Current', planned: 'Planned', past: 'Past', stats: 'Stats' };
// The way back: the page the sprint was opened from, else its own list.
function backLink(s) {
  const fallback = { planned: '/planned', completed: '/past' }[s.status] || '/current';
  const from = route().from || fallback;
  return `<a href="#${esc(from)}">← ${PAGE_NAMES[from.split('/')[1] || ''] || 'Back'}</a>`;
}

const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});

// Horizontal bar: linear or log; small text beside it.
function hbar(v, max, text, color = 'var(--scope-o)', { log = false, lo = 0.25, tipText } = {}) {
  let pct = 0;
  if (v != null && v > 0) pct = log ? Math.log2(Math.max(v, lo) / lo) / Math.log2(max / lo) : v / max;
  return `<div class="hb" ${tipText ? `data-tip="${esc(tipText)}"` : ''}><div class="track"><div class="fill" style="width:${Math.max(pct * 100, v ? 1 : 0)}%;background:${color}"></div></div><span class="lbl">${text}</span></div>`;
}
// Points not yet worked on: one outlined dot per point.
const ringDots = (n, unit = 'pts') => `<div class="dots" data-tip="${n} ${unit}">${'<span class="dot ring"></span>'.repeat(n || 0)}</div>`;
// Delivered against the original scope: one green dot per delivered point,
// a hollow one per point not delivered, a dashed line after the start.
function outcome(start, end, scaleMax, unit = 'pts') {
  start = start || 0; end = end ?? start;
  const tipT = `${start} → ${end} ${unit}`
    + (end < start ? ` (${start - end} not delivered)` : '')
    + (end > start ? ` (+${end - start} added)` : '');
  let r = '';
  for (let i = 0; i < Math.max(start, end); i++) {
    if (i === start) r += '<span class="pmark"></span>';
    r += `<span class="dot ${i < end ? '' : 'hollow'}"${i < end ? ' style="background:var(--st-done)"' : ''}></span>`;
  }
  if (start >= end) r += '<span class="pmark"></span>';
  return `<div class="dots" data-tip="${esc(tipT)}">${r}</div>`;
}
const segLegend = `<div class="legend">
  <span><i style="background:var(--st-done);border-radius:50%"></i>Delivered</span>
  <span><i class="hollow" style="border-radius:50%"></i>Not delivered</span>
  <span><i style="background:none;width:0;height:12px;border-left:1px dashed
    var(--text);border-radius:0"></i>Original scope</span></div>`;
// Velocity heat on the dial's log scale, 0.25–64 pts/h: yellow when slow,
// through amber and orange, to red when fast.
const VLO = 0.25, VHI = 64;
const vT = v => Math.min(Math.max(
  Math.log2(Math.max(v, VLO) / VLO) / Math.log2(VHI / VLO), 0), 1);
const heat = t => {
  const x = Math.min(Math.max(t, 0), 1) * 3, i = Math.min(2, Math.floor(x));
  return `color-mix(in srgb, var(--heat-${i}), var(--heat-${i + 1}) `
    + `${Math.round((x - i) * 100)}%)`;
};
const heatV = v => heat(vT(v || 0));
const heatLegend = `<div class="legend" style="margin-bottom:6px"><span><i class="heatlg"></i>slower → faster</span><span><svg width="22" height="12" viewBox="0 0 22 12" style="vertical-align:-2px;margin-right:4px"><line x1="1" y1="6" x2="21" y2="6" stroke="var(--text)" stroke-dasharray="5 4"/></svg>median</span></div>`;
// Speedometer: a wide half-ellipse on the velocity log scale, filled with
// heat up to the value. The needle has one length at every angle, like a
// real dial, and its hub sits flat on the arch's base line.
let dialId = 0;
function dial(v, big, marks = []) {
  const w = big ? 118 : 92, rx = w * 0.46, ry = rx * 0.55, cx = w / 2;
  const cy = ry + 4, sw = big ? 10 : 6, N = 28, at = v == null ? 0 : vT(v);
  // Fraction p is the needle's angle; the arch point is where that ray
  // meets the ellipse, so the fill ends exactly under the needle.
  const pt = (p, sx, sy) => {
    const a = Math.PI * (1 - p), c = Math.cos(a), si = Math.sin(a);
    const r = sx * sy / Math.hypot(sy * c, sx * si);
    return [(cx + r * c).toFixed(2), (cy - r * si).toFixed(2)];
  };
  let g = '';
  for (let k = 0; k < N; k++) {
    const p0 = k / N, p1 = (k + 1) / N, m = (p0 + p1) / 2;
    const [x0, y0] = pt(p0, rx, ry), [x1, y1] = pt(p1, rx, ry);
    const c = v != null && m <= at ? heat(m) : 'var(--dial-track)';
    g += `<path d="M${x0} ${y0}A${rx} ${ry} 0 0 1 ${x1} ${y1}"
      style="stroke:${c}"/>`;
  }
  g = `<g fill="none" stroke-width="${sw}">${g}</g>`;
  const id = `dial${++dialId}`, L = ry * 0.55, hr = big ? 4.5 : 3;
  if (v != null) {
    const [x, y] = pt(at, L, L);
    g += `<clipPath id="${id}"><rect width="${w}" height="${cy}"/></clipPath>
      <line clip-path="url(#${id})" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"
      stroke="var(--text)" stroke-width="${big ? 2 : 1.5}"
      stroke-linecap="round"/>`;
  }
  g += `<path d="M${cx - hr} ${cy}A${hr} ${hr} 0 0 1 ${cx + hr} ${cy}Z"
    fill="var(--text)"/>`;
  // Reference ticks (median, average) cross the arch at their value.
  for (const [mv, color] of marks) {
    if (mv == null) continue;
    const [x0, y0] = pt(vT(mv), rx - sw / 2 - 2, ry - sw / 2 - 2);
    const [x1, y1] = pt(vT(mv), rx + sw / 2 + 2, ry + sw / 2 + 2);
    g += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${color}"
      stroke-width="2" stroke-linecap="round"/>`;
  }
  const tipT = `${v == null ? '—' : num(v, 2)} pts/h`
    + marks.filter(([mv]) => mv != null)
      .map(([mv, , name]) => ` · ${name} ${num(mv, 2)}`).join('')
    + ' · scale 0.25–64, log';
  return `<svg class="dial" width="${w}" height="${cy.toFixed(1)}"
    viewBox="0 0 ${w} ${cy.toFixed(1)}" data-tip="${esc(tipT)}" role="img"
    aria-label="${esc(tipT)}">${g}</svg>`;
}
// A tile's details: up to four name/value rows to the right of its figure.
const miniTable = (rows, fmt) => rows.length ? `<table class="mini">${rows.slice(0, 4).map(([k, v]) =>
  `<tr><td>${esc(k)}</td><td>${fmt(v)}</td></tr>`).join('')}${rows.length > 4 ? `<tr><td colspan="2">+${rows.length - 4} more</td></tr>` : ''}</table>` : '';
// In Progress and Verifying shares of active time, as one small bar.
const activeSplit = a => { const ip = a?.['In Progress'] || 0, vf = a?.['Verifying'] || 0;
  return `<span class="split" data-tip="${esc(`In Progress ${fmtMin(ip)} · Verifying ${fmtMin(vf)}`)}">
    <i style="flex:${ip};background:var(--st-prog)"></i><i style="flex:${vf};background:var(--st-verify)"></i></span>`; };
const timerColor = k => TIMERS.includes(k) ? `var(--t${TIMERS.indexOf(k) + 1})` : 'var(--t-other)';
// Past cards as card icons: green per delivered card, hollow per card not
// delivered, a dashed line after the original scope.
function cardRow(start, end) {
  start = start || 0; end = end ?? start;
  let r = '';
  for (let i = 0; i < Math.max(start, end); i++) {
    if (i === start) r += '<span class="otick"></span>';
    r += `<span class="ci ${i < end ? 'd' : 'r'}"></span>`;
  }
  if (start >= end) r += '<span class="otick"></span>';
  const tipT = `${start} → ${end} cards`
    + (end < start ? ` (${start - end} not delivered)` : '')
    + (end > start ? ` (+${end - start} added)` : '');
  return `<div class="cicons" data-tip="${esc(tipT)}">${r}</div>`;
}
const cardIcons = (colors, big) => `<div class="cicons">${colors.map(c => c === 'plain' ? `<span class="ci plain ${big ? 'big' : ''}"></span>` : c === stC.Cancelled ? `<span class="ci r ${big ? 'big' : ''}"></span>` : `<span class="ci ${big ? 'big' : ''} ${c === stC.Verifying ? 'v' : ''}" style="background:${c}"></span>`).join('')}</div>`;

// A total that leaves out cancelled cards, naming them only when there are some.
const liveTotal = (live, cancelled, unit) => `${live} <span class="muted small">${unit}${cancelled ? ` / ${cancelled} cancelled` : ''}</span>`;
// Points by state, one dot per point, total outside, dashed start marker.
// Points removed since the start show as hollow dots up to it.
function stateBar(cards, start, unit, tipText = '') {
  const val = c => unit === 'pts' ? c.points : 1;
  const tot = cards.reduce((a, c) => a + val(c), 0);
  const marker = `<span class="pmark" ${tipText ? `data-tip="${esc(tipText)}"` : ''}><b>start ${start}</b></span>`;
  let r = '', n = 0;
  const put = (html, count) => { for (let i = 0; i < count; i++, n++) { if (n === start) r += marker; r += html; } };
  PROGRESS.forEach(st => {
    const k = cards.filter(c => c.state === st).reduce((a, c) => a + val(c), 0);
    put(`<span class="dot${st === 'Cancelled' ? ' hollow' : ''}" ${st === 'Cancelled' ? '' : `style="background:${stC[st]}"`} data-tip="${st}: ${k} ${unit}"></span>`, k);
  });
  put('<span class="dot hollow" data-tip="Removed since the start"></span>', Math.max(0, start - tot));
  if (n === start) r += marker;
  const cancelled = cards.filter(c => c.state === 'Cancelled').reduce((a, c) => a + val(c), 0);
  return `<div class="sbar"><div class="dots">${r}</div><span class="sp"></span>
    <span class="tot">${liveTotal(tot - cancelled, cancelled, unit)}</span></div>`;
}
// Every state, always: the legend needs no data, so it is the same loading or loaded.
const legendOf = cls => `<div class="legend ${cls}">${PROGRESS.map(st => `<span><i ${swatch(st)}></i>${st}</span>`).join('')}</div>`;
const stateLegend = legendOf('');

const niceStep = v => { const r = v / 4 || 1, e = 10 ** Math.floor(Math.log10(r)); return [1, 2, 2.5, 5, 10].map(m => m * e).find(x => x >= r); };
// Column chart: stacked linear, or single-series log. One axis, hover per column, click opens sprint.
function colChart({ data, stacks, w = 1100, h = 220, fmt = v => num(v), log = false, lo = 0.25, ref, refLabel, tipFn, mark, markLabel, whole = false }) {
  if (!data.length) return '<p class="muted">No sprints to chart.</p>';
  h += 26; // room for vertical sprint numbers under the columns
  const pad = { l: 46, r: 12, t: 12, b: 52 }, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const totals = data.map(d => stacks.reduce((a, s) => a + (s.get(d) || 0), 0));
  // Counts get whole-number ticks, so no label repeats after rounding.
  const top = Math.max(...totals), step = whole ? Math.max(1, niceStep(top)) : niceStep(top), max = log ? 2 ** Math.ceil(Math.log2(top)) : Math.ceil(top / step) * step;
  const sy = v => log ? pad.t + ih - Math.log2(Math.max(v, lo) / lo) / Math.log2(max / lo) * ih : pad.t + ih - v / max * ih;
  const ticks = log ? Array.from({ length: Math.log2(max / lo) + 1 }, (_, i) => lo * 2 ** i) : Array.from({ length: Math.round(max / step) + 1 }, (_, i) => i * step);
  const bw = iw / data.length, gap = bw > 6 ? 2 : 1;
  let out = ticks.map(v => `<line class="gl" x1="${pad.l}" x2="${w - pad.r}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${pad.l - 6}" y="${sy(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  data.forEach((d, i) => {
    const x = pad.l + i * bw + gap / 2, bwid = Math.max(bw - gap, 1); let acc = log ? lo : 0;
    stacks.forEach(s => { const v = s.get(d) || 0; if (!v) return;
      const y0 = sy(acc), y1 = sy(acc + v); acc += v;
      out += s.hollow ? `<rect x="${x + .5}" y="${y1}" width="${bwid - 1}" height="${y0 - y1}" fill="none" stroke="var(--muted)" stroke-dasharray="2 1.5"/>`
        : `<rect x="${x}" y="${y1}" width="${bwid}" height="${Math.max(y0 - y1 - (stacks.length > 1 ? 1 : 0), .5)}" style="fill:${typeof s.color === 'function' ? s.color(d) : s.color}"/>`; });
    if (mark) out += `<line x1="${x}" x2="${x + bwid}" y1="${sy(mark(d))}"
      y2="${sy(mark(d))}" stroke="var(--text)" stroke-dasharray="2 1.5"/>`;
    out += `<text transform="translate(${pad.l + (i + .5) * bw + 3} ${pad.t + ih + 4}) rotate(-90)" text-anchor="end" style="font-size:${Math.min(10, bw * .8)}px">${d.sprint}</text>`;
    out += `<rect x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${ih + 26}" fill="transparent" style="cursor:pointer" ${goto(d.sprint)} data-tip="${esc(tipFn(d))}"/>`;
  });
  if (ref != null) out += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${sy(ref)}" y2="${sy(ref)}" stroke="var(--text)" stroke-dasharray="5 4"/><text x="${w - pad.r}" y="${sy(ref) - 5}" text-anchor="end">${refLabel}</text>`;
  out += `<text x="${pad.l}" y="${h - 7}">${esc(ago(data[0].started))}</text><text x="${w - pad.r}" y="${h - 7}" text-anchor="end">${esc(ago(data[data.length - 1].started))}</text>`;
  const leg = stacks.length > 1 ? `<div class="legend" style="margin-bottom:6px">${stacks.map(s => `<span><i ${s.hollow ? 'class="hollow"' : `style="background:${s.color}"`}></i>${s.label}</span>`).join('')}${mark ? `<span><i style="background:none;
    width:12px;height:0;border-top:1px dashed var(--text);border-radius:0;
    vertical-align:3px"></i>${markLabel}</span>` : ''}</div>` : '';
  return leg + `<svg class="chart" viewBox="0 0 ${w} ${h}">${out}</svg>`;
}
// Counts per sprint as stacked units: a dot per point or a card icon per
// card, green when delivered and hollow when not, with a dashed tick at the
// original scope. Units shrink only when many sprints or a tall stack would
// not fit.
function stackChart({ data, start, end, kind, tipFn, w = 1100, h = 220 }) {
  if (!data.length) return '<p class="muted">No sprints to chart.</p>';
  h += 26;
  const pad = { l: 46, r: 12, t: 12, b: 52 }, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const top = Math.max(1, ...data.map(d => Math.max(start(d), end(d))));
  const bw = iw / data.length, card = kind === 'cards';
  const unit = Math.min(card ? 16 : 10, ih / top, card ? bw * 1.1 : bw * .9);
  const ys = k => pad.t + ih - k * unit;
  const step = Math.max(1, niceStep(top));
  let out = '';
  for (let v = 0; v <= top; v += step) out += `<line class="gl" x1="${pad.l}" x2="${w - pad.r}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${pad.l - 6}" y="${ys(v) + 4}" text-anchor="end">${v}</text>`;
  data.forEach((d, i) => {
    const cx = pad.l + (i + .5) * bw, s0 = start(d), e0 = end(d);
    for (let k = 0; k < Math.max(s0, e0); k++) {
      const y = ys(k + 1), on = k < e0;
      if (card) {
        const cw = unit * .75, ch = unit * .88, x = cx - cw / 2;
        out += on ? `<rect x="${x}" y="${y + unit * .06}" width="${cw}" height="${ch}" rx="2" fill="var(--st-done)"/>`
            + [.3, .55].map(f => `<line x1="${x + cw * .25}" x2="${x + cw * .75}" y1="${y + unit * f}" y2="${y + unit * f}" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/>`).join('')
          : `<rect x="${x + .5}" y="${y + unit * .06 + .5}" width="${cw - 1}" height="${ch - 1}" rx="2" fill="none" stroke="var(--muted)" stroke-dasharray="2 1.5"/>`;
      } else {
        const r = unit * .4, cy = y + unit / 2;
        out += on ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--st-done)"/>`
          : `<circle cx="${cx}" cy="${cy}" r="${r - .4}" fill="none" stroke="var(--muted)" stroke-dasharray="1.5 1.2"/>`;
      }
    }
    const half = (card ? unit * .75 : unit * .8) / 2 + 3;
    out += `<line x1="${cx - half}" x2="${cx + half}" y1="${ys(s0)}" y2="${ys(s0)}" stroke="var(--text)" stroke-dasharray="2 1.5"/>`;
    out += `<text transform="translate(${cx + 3} ${pad.t + ih + 4}) rotate(-90)" text-anchor="end" style="font-size:${Math.min(10, bw * .8)}px">${d.sprint}</text>`;
    out += `<rect x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${ih + 26}" fill="transparent" style="cursor:pointer" ${goto(d.sprint)} data-tip="${esc(tipFn(d))}"/>`;
  });
  out += `<text x="${pad.l}" y="${h - 7}">${esc(ago(data[0].started))}</text><text x="${w - pad.r}" y="${h - 7}" text-anchor="end">${esc(ago(data[data.length - 1].started))}</text>`;
  const shape = card ? 'border-radius:2px' : '';
  const leg = `<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--st-done);${shape}"></i>Delivered</span><span><i class="hollow" style="${shape}"></i>Not delivered</span><span><i style="background:none;width:12px;height:0;border-top:1px dashed var(--text);border-radius:0;vertical-align:3px"></i>Original scope</span></div>`;
  return leg + `<svg class="chart" viewBox="0 0 ${w} ${h}">${out}</svg>`;
}

let READINESS = null, readinessState = 'idle', readinessError = null;

function loadReadiness() {
  if (readinessState === 'loading') return;
  readinessState = 'loading';
  busyStart();
  getJSON('api/readiness')
    .then(d => {
      READINESS = d;
      readinessState = 'done';
    })
    .catch(e => {
      readinessError = e.message;
      readinessState = 'error';
    })
    .finally(() => {
      busyEnd();
      if (route().view === '' || route().view === 'overview' || route().view === 'planned' || route().view === 'sprint') {
        render();
      }
    });
}

const stateClass = st => {
  if (st === 'Can start') return 'start';
  if (st === 'Overlap') return 'overlap';
  if (st === 'Unverified') return 'unknown';
  if (st === 'Not ready') return 'notready';
  return '';
};
function formatWhyTooltip(whyList) {
  if (!whyList || !whyList.length) return '';
  const groups = new Map();
  const others = [];
  whyList.forEach(item => {
    const s = String(item);
    const idx = s.indexOf(': ');
    if (idx !== -1 && s.startsWith('Waits on')) {
      const head = s.slice(0, idx + 1);
      const detail = s.slice(idx + 2);
      if (!groups.has(head)) groups.set(head, []);
      groups.get(head).push(detail);
    } else {
      others.push(s);
    }
  });
  const parts = [];
  groups.forEach((details, head) => {
    parts.push(`<b>${esc(head)}</b><br/>${details.map(d => `&nbsp;&nbsp;${esc(d)}`).join('<br/>')}`);
  });
  others.forEach(o => parts.push(esc(o)));
  return parts.join('<br/><br/>');
}

const stateBadge = (st, s) => {
  if (s && st === 'Not ready' && s.blocked_cards > 0) {
    const tip = formatWhyTooltip(s.why);
    return `<span class="state notready" data-tip="${tip}">${s.blocked_cards}/${s.cards_count} blocked</span>`;
  }
  return `<span class="state ${stateClass(st)}">${esc(st)}</span>`;
};

function cardIconsHtml(cardsOrTotal, undeclared = 0, big = false) {
  if (Array.isArray(cardsOrTotal)) {
    return cardsOrTotal.map(c => {
      const isBlocked = Boolean(c.is_blocked || c.waits_on?.length);
      const isNoScope = !c.declared;
      const isUnkDeps = !c.assessed;
      const isGo = Boolean(c.can_proceed ?? (!isBlocked && !isNoScope && !isUnkDeps));

      let cls = '';
      const notes = [];
      if (isBlocked) {
        cls = 'b';
        notes.push(c.waits_on?.length ? `waits on ${c.waits_on.map(w => w.ref).join(', ')}` : 'blocked');
      } else if (isGo) {
        cls = 'go';
        notes.push('clear to start');
      }
      if (isNoScope) {
        cls = cls ? `${cls} u` : 'u';
        notes.push('no file scope');
      }
      if (isUnkDeps) {
        cls = cls ? `${cls} unk` : 'unk';
        notes.push('unknown dependencies');
      }

      const tip = `${esc(c.ref)}: ${esc(c.title)}${notes.length ? ` · ${notes.join(' · ')}` : ''}`;
      return `<span class="ci plain ${big ? 'big ' : ''}${cls}" data-tip="${tip}"></span>`;
    }).join('');
  }
  const total = cardsOrTotal ?? 0;
  let r = '';
  for (let i = 0; i < total; i++) {
    const isU = i >= total - undeclared;
    r += `<span class="ci plain ${big ? 'big ' : ''}${isU ? 'u' : ''}"></span>`;
  }
  return r;
}

// A planned sprint's own page: its size, the sprints around it in the
// dependency graph, whether it can start, and each card's waits and shared
// code. The readiness report supplies all but the size.
const sprintName = id => { const o = byId[id]; return `${o?.alias ? esc(o.alias) + ' ' : ''}#${id}`; };
// Running sprints are blue, as on the Planned graph; a planned sprint that
// could run at the same time is red.
const sprintPill = (id, clash) => {
  const kind = byId[id]?.status === 'current' ? ' run' : clash ? ' clash' : '';
  return `<a class="pill${kind}" href="${sprintHref(id)}">${sprintName(id)}</a>`;
};

function sizeHtml(s, q) {
  const velocity = READINESS?.summary?.velocity ?? MEDV;
  const est = POINTS && velocity ? `<div class="card est"><div class="v">≈ ${fmtH(s.points / velocity)}</div><div class="l">Estimated at ${num(velocity, 2)} pts/h</div></div>` : '';
  const undeclared = q ? q.cards.filter(c => !c.declared).length : 0;
  const icons = q?.cards ? cardIconsHtml(q.cards, 0, true) : (s.cards == null ? skIcons(4, true) : cardIconsHtml(s.cards, undeclared, true));

  let breakdown = '';
  if (q?.cards) {
    const ready = q.cards.filter(c => c.can_proceed).length;
    const blocked = q.cards.filter(c => c.is_blocked).length;
    const noScope = q.cards.filter(c => !c.declared).length;
    const unkDeps = q.cards.filter(c => !c.assessed).length;
    const parts = [];
    if (ready > 0) parts.push(`<span style="color:var(--parallel);font-weight:600">${ready} clear to start</span>`);
    if (blocked > 0) parts.push(`<span style="color:var(--warn);font-weight:600">${blocked} blocked</span>`);
    if (noScope > 0) parts.push(`<span style="color:var(--muted);font-style:italic;font-weight:300">${noScope} no file scope</span>`);
    if (unkDeps > 0) parts.push(`<span style="color:var(--unclear);font-style:italic;font-weight:300">${unkDeps} unknown dependencies</span>`);
    if (parts.length) {
      breakdown = `<div class="small" style="margin-top:6px">${parts.join(' · ')}</div>`;
    }
  }

  return `<div class="size"><div class="card">
    <div class="sline">${icons}<span>${s.cards ?? '…'} card${s.cards === 1 ? '' : 's'}</span></div>
    ${breakdown}
    ${POINTS ? `<div class="sline" style="margin-top:12px">${ringDots(s.points)}<span>${s.points} pts</span></div>` : ''}
  </div>${est}</div>`;
}

function sprintNodeBadge(x, y, W, H, { run, sprint, mark }) {
  if (run) {
    return `<text x="${x + W - 10}" y="${y + H / 2 + 5}" font-size="11" text-anchor="end" fill="var(--text-2)">running</text>`;
  }
  const ready = sprint?.ready_cards ?? (sprint?.state === 'Can start' ? sprint?.cards_count : 0);
  const total = sprint?.cards_count;
  const pill = (ready > 0 && total != null) ? (() => {
    const txt = `${ready}/${total}`;
    const bw = txt.length >= 5 ? 40 : 34;
    const bh = 18;
    const bx = x + W - 38 - bw;
    const by = y + (H - bh) / 2;
    const tip = `${ready} of ${total} cards clear to start in parallel`;
    return `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4" fill="var(--parallel-bg)" stroke="var(--parallel)" stroke-width="1.2"><title>${tip}</title></rect>
      <text x="${bx + bw / 2}" y="${by + 13}" font-size="11" font-weight="700" fill="var(--parallel)" text-anchor="middle"><title>${tip}</title>${txt}</text>`;
  })() : '';
  const m = mark ? `<text x="${x + W - 10}" y="${y + H / 2 + 6}" font-size="18" text-anchor="end" fill="var(--text-2)">${mark}</text>` : '';
  return `<g>${pill}${m}</g>`;
}

// Every sprint this one waits on, directly or not, to its left, and every
// sprint that waits on it to its right: the whole chain from start to end
// through this sprint. Columns are the longest path from the chain's start,
// so arrows always run left to right; the longest chain is green, as on
// the Planned page.
function chainSvg(s) {
  const deps = READINESS.graph?.dependencies || [];
  const reach = (start, step) => {
    const seen = new Set(), todo = [start];
    while (todo.length) {
      const at = todo.pop();
      deps.forEach(d => {
        const [x, y] = step(d);
        if (x === at && !seen.has(y)) { seen.add(y); todo.push(y); }
      });
    }
    return seen;
  };
  const up = reach(s.sprint, d => [d.to, d.from]), down = reach(s.sprint, d => [d.from, d.to]);
  if (!up.size && !down.size) return '<p class="muted" style="margin:0">No other sprint must finish first, and none waits on this one.</p>';
  const ids = new Set([...up, s.sprint, ...down]);
  const edges = deps.filter(d => ids.has(d.from) && ids.has(d.to)).map(d => ({ ...d, outY: 0, inY: 0 }));
  const col = {};
  const depth = id => col[id] ??= Math.max(0, ...edges.filter(d => d.to === id).map(d => depth(d.from) + 1));
  ids.forEach(depth);
  const q = Object.fromEntries((READINESS.queue || []).map(r => [r.sprint_id, r]));
  const mark = id => byId[id]?.status === 'current' ? 'running' : ({ 'Can start': '🚀', Overlap: '⚠️', Unverified: '❓', 'Not ready': '⏳' }[q[id]?.state] || '');
  const W = 180, H = 40, GX = 60, GY = 14, TOP = 26;
  const cols = [];
  [...ids].sort((a, b) => a - b).forEach(id => (cols[col[id]] ||= []).push(id));
  const tall = Math.max(...cols.map(c => c.length));
  const height = TOP + tall * (H + GY);
  const X = c => 10 + c * (W + GX);
  const pos = {};
  cols.forEach((list, c) => list.forEach((id, i) => {
    pos[id] = [X(c), TOP + (tall - list.length) * (H + GY) / 2 + i * (H + GY)];
  }));
  const width = X(cols.length - 1) + W + 10;
  const head = (c, t) => `<text x="${X(c)}" y="14" font-size="12" font-weight="600" fill="var(--text-2)">${t}</text>`;
  const me = col[s.sprint];
  let g = (me > 0 ? head(0, 'Starts the chain') : '') + head(me, 'This sprint') + (me < cols.length - 1 ? head(cols.length - 1, 'Ends the chain') : '');
  // Arrows leaving or entering a sprint fan out along its edge.
  const fan = (key, other, slot) => {
    const at = {};
    edges.forEach(d => (at[d[key]] ||= []).push(d));
    Object.values(at).forEach(group => {
      group.sort((p, r) => pos[p[other]][1] - pos[r[other]][1]);
      group.forEach((d, i) => { d[slot] = (i - (group.length - 1) / 2) * Math.min(8, (H - 12) / group.length); });
    });
  };
  fan('from', 'to', 'outY');
  fan('to', 'from', 'inY');
  const critical = new Set(READINESS.graph?.critical_edges || []);
  edges.sort((p, r) => critical.has(`${p.from}-${p.to}`) - critical.has(`${r.from}-${r.to}`)).forEach(d => {
    const [x1, y1] = pos[d.from], [x2, y2] = pos[d.to];
    const sx = x1 + W, sy = y1 + H / 2 + d.outY, ex = x2 - 8, ey = y2 + H / 2 + d.inY;
    const crit = critical.has(`${d.from}-${d.to}`), ink = crit ? 'var(--chain)' : 'var(--text-2)';
    g += `<g><path d="M${sx} ${sy} C${sx + GX / 2} ${sy} ${ex - GX / 2} ${ey} ${ex} ${ey}" fill="none" stroke="${ink}" stroke-width="${crit ? 2 : 1.5}"><title>${sprintName(d.to)} waits on ${sprintName(d.from)}: ${esc(d.reason)}${crit ? ' (longest chain)' : ''}</title></path>
      <path d="M${ex} ${ey - 5} L${ex + 8} ${ey} L${ex} ${ey + 5} Z" fill="${ink}"/></g>`;
  });
  Object.entries(pos).forEach(([id, [x, y]]) => {
    const self = +id === s.sprint, o = byId[id], run = o?.status === 'current', qRow = q[id];
    const node = `<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="6" fill="var(--surface-2)" stroke="${self ? 'var(--text)' : run ? 'var(--st-prog)' : 'var(--border)'}" stroke-width="${self || run ? 2 : 1}"/>
      <text x="${x + 10}" y="${y + H / 2 + 5}" font-size="13" fill="var(--text)"><tspan font-weight="600">${esc(o?.alias || '')}</tspan>${o?.alias ? ' ' : ''}<tspan fill="var(--muted)">#${id}</tspan></text>
      ${sprintNodeBadge(x, y, W, H, { run, sprint: qRow, mark: mark(id) })}`;
    g += self ? node : `<a href="${sprintHref(id)}">${node}</a>`;
  });
  return `<svg style="display:block" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${g}</svg>`;
}

function readinessPanels(q) {
  const others = new Set(q.cards.flatMap(c => c.waits_on.filter(w => w.sprint_id != null).map(w => w.sprint_id)));
  const outside = q.cards.some(c => c.waits_on.some(w => w.sprint_id == null));
  const unassessed = q.cards.filter(c => !c.assessed).length;
  const undeclared = q.cards.filter(c => !c.declared).length;
  const clash = new Set((READINESS.overlap_pairs || []).flatMap(p => p.sprint_a === q.sprint_id ? [p.sprint_b] : p.sprint_b === q.sprint_id ? [p.sprint_a] : []));
  const sharing = [...new Set(q.cards.flatMap(c => c.shares.map(x => x.sprint_id)))].sort((a, b) => a - b);
  const verdict = {
    'Can start': 'Clear to start now.',
    Overlap: 'Shares code with a sprint that could run at the same time.',
    Unverified: `${undeclared + unassessed === 0 ? 'Some cards' : [undeclared && `${undeclared} card${undeclared === 1 ? '' : 's'} with no file scope`, unassessed && `${unassessed} with unknown dependencies`].filter(Boolean).join(', ')}.`,
    'Not ready': q.ready_cards > 0
      ? `${q.ready_cards} of ${q.cards_count} cards are clear to start now in parallel. ${q.blocked_cards} card${q.blocked_cards === 1 ? ' waits' : 's wait'} on unfinished work in another sprint.`
      : 'Waits on unfinished cards in another sprint.',
  }[q.state];
  const depMark = others.size || outside
    ? `<span class="mark no">✗</span>Waits on ${others.size ? `${others.size} sprint${others.size === 1 ? '' : 's'}` : ''}${others.size && outside ? ' and ' : ''}${outside ? 'cards outside every sprint' : ''}`
    : unassessed
      ? `<span class="mark maybe">?</span>None recorded, but ${unassessed} card${unassessed === 1 ? '' : 's'} with unknown dependencies`
      : '<span class="mark yes">✓</span>Nothing to wait for';
  return `<div class="grid g3">
    <div class="card verdict">${stateBadge(q.state, q)}<p>${verdict}</p></div>
    <div class="card rpanel"><h3>Shares code with</h3>${sharing.length
      ? `<div class="pills">${sharing.map(id => sprintPill(id, clash.has(id))).join('')}</div>${(() => {
        const running = sharing.some(id => byId[id]?.status === 'current');
        const later = sharing.some(id => clash.has(id) && byId[id]?.status !== 'current');
        return running || later ? `<p>${[running && 'Blue: running.', later && 'Purple: could run at the same time.'].filter(Boolean).join(' ')}</p>` : '';
      })()}`
      : '<p class="muted" style="margin:0">No other sprint.</p>'}</div>
    <div class="card rpanel"><h3>Dependencies</h3><div style="display:flex;align-items:center">${depMark}</div>${others.size ? `<div class="pills" style="margin-top:8px">${[...others].map(id => sprintPill(id)).join('')}</div>` : ''}</div>
  </div>`;
}

function cardListHtml(q) {
  if (!q.cards.length) return '<div class="card muted">No open cards.</div>';
  const cardLink = (ref, id) => {
    if (DATA.browse_url && ref) {
      return `<a href="${esc(DATA.browse_url + ref)}/" target="_blank" rel="noopener">${esc(ref)}</a>`;
    }
    if (DATA.board_url && id) {
      return `<a href="${esc(DATA.board_url + id)}" target="_blank" rel="noopener">${esc(ref || id)}</a>`;
    }
    return esc(ref || id);
  };
  const link = c => cardLink(c.ref, c.id);
  const sprintLink = sid => `<a href="${sprintHref(sid)}">${sprintName(sid)}</a>`;
  const rows = q.cards.map(c => {
    // Per path, the other cards grouped by sprint: "EVT-10 #49: WAY-235, WAY-236".
    const byPath = new Map();
    c.shares.forEach(x => x.paths.forEach(p => {
      const sprints = byPath.get(p) || byPath.set(p, new Map()).get(p);
      (sprints.get(x.sprint_id) || sprints.set(x.sprint_id, []).get(x.sprint_id)).push(cardLink(x.ref));
    }));
    const flags = [c.broad?.length ? `<span class="flag">declares ${c.broad.map(esc).join(', ')}, not files</span>` : '', !c.declared ? '<span class="flag u">no file scope</span>' : '', !c.assessed ? '<span class="flag unk">unknown dependencies</span>' : ''].filter(Boolean);
    const waits = c.waits_on.map(w => `<li>${w.sprint_id == null ? '' : `${sprintLink(w.sprint_id)}: `}${cardLink(w.ref)}${w.state ? ` <span class="muted">(${esc(w.state)})</span>` : ''}</li>`).join('');
    const shares = [...byPath].map(([p, with_]) => `<li><span class="mono">${esc(p).replaceAll('/', '/<wbr>')}</span><br><span class="muted">with</span> ${[...with_].map(([sid, links]) => `${sprintLink(sid)}: ${links.join(', ')}`).join('; ')}</li>`).join('');
    const badge = c.can_proceed
      ? '<span class="pill" style="color:var(--parallel);border-color:var(--parallel);background:var(--parallel-bg);font-size:11px;margin-left:6px">clear to start</span>'
      : c.is_blocked
        ? '<span class="pill muted" style="margin-left:6px;font-size:11px">waits</span>'
        : '';
    return `<tr>
      <td class="ref mono small">${link(c)}${badge}</td>
      <td><b>${esc(c.title)}</b>${flags.length ? `<div>${flags.join('')}</div>` : ''}</td>
      ${POINTS ? `<td style="min-width:90px">${ringDots(c.points)}<div class="small muted" style="margin-top:3px">${c.points} pt${c.points === 1 ? '' : 's'}</div></td>` : ''}
      <td data-k="Waits on" class="${waits ? '' : 'empty'}">${waits ? `<ul>${waits}</ul>` : '<span class="muted">—</span>'}</td>
      <td data-k="Shares code" class="${shares ? '' : 'empty'}">${shares ? `<ul>${shares}</ul>` : '<span class="muted">—</span>'}</td>
    </tr>`;
  }).join('');
  return `<div class="card clist"><table><thead><tr><th>Card</th><th>Title</th>${POINTS ? '<th>Points</th>' : ''}<th>Waits on</th><th>Shares code</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderDagSvg() {
  if (!READINESS?.graph) {
    return `<div style="padding:16px 0">${sk('100%', 120)}</div>`;
  }
  const S = {};
  (current || []).forEach(s => {
    S[s.sprint] = [s.alias || '', 'running', 'run', false, s];
  });
  (READINESS.queue || []).forEach(s => {
    const mark = s.state === 'Can start' ? '🚀' : s.state === 'Overlap' ? '⚠️' : s.state === 'Unverified' ? '❓' : '⏳';
    const kind = s.state === 'Can start' ? 'start' : s.state === 'Overlap' ? 'overlap' : s.state === 'Unverified' ? 'unknown' : 'wait';
    const unclear = Boolean(s.unassessed > 0);
    S[s.sprint_id] = [s.alias || '', mark, kind, unclear, s];
  });

  const rawCols = READINESS.graph.columns || {};
  const col = {};
  Object.keys(S).forEach(id => {
    col[id] = rawCols[id] ?? (rawCols[+id] ?? 0);
  });

  const W = 180, H = 40, GX = 80, GY = 26, X = c => 50 + c * (W + GX);
  const rows = {}, pos = {};
  Object.keys(S).sort((a, b) => a - b).forEach(id => {
    const c = col[id];
    rows[c] = (rows[c] || 0) + 1;
    pos[id] = [X(c), 34 + (rows[c] - 1) * (H + GY)];
  });

  const maxCol = Math.max(0, ...Object.values(col));
  const maxRows = Math.max(1, ...Object.values(rows));
  const width = X(maxCol) + W + 10;
  const height = 34 + maxRows * (H + GY);

  let g = `<text x="${X(0)}" y="16" font-size="12" font-weight="600" fill="var(--text-2)">Running / Can start</text>`
    + (maxCol >= 1 ? `<text x="${X(1)}" y="16" font-size="12" font-weight="600" fill="var(--text-2)">Other sprints</text><line x1="${X(1) - GX / 2}" y1="4" x2="${X(1) - GX / 2}" y2="${height - 4}" stroke="var(--border)"/>` : '');

  // Overlap dashed arcs
  (READINESS.overlap_pairs || []).forEach(p => {
    const a = p.sprint_a, b = p.sprint_b, path = (p.paths || []).join(', ');
    if (!pos[a] || !pos[b]) return;
    const [x1, y1] = pos[a], [x2, y2] = pos[b];
    const same = x1 === x2;
    const ax = same ? x1 : x1 + W / 2, ay = same ? y1 + H / 2 : y1 + H;
    const bx = same ? x2 : x2 + W / 2, by = same ? y2 + H / 2 : y2 + H;
    const cx = same ? x1 - 40 : (ax + bx) / 2, cy = same ? (ay + by) / 2 : Math.max(ay, by) + 30;
    g += `<g class="link" data-a="${a}" data-b="${b}"><path d="M${ax} ${ay} Q${cx} ${cy} ${bx} ${by}" fill="none" stroke="var(--overlap)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"><title>Shares ${esc(path)}</title></path></g>`;
  });

  // Dependencies. Arrows leaving or entering one sprint fan out along its
  // edge, ordered by the other end's height, so they never share a line;
  // the longest chain is drawn last, so nothing covers it.
  const critical = new Set(READINESS.graph.critical_edges || []);
  const deps = (READINESS.graph.dependencies || []).filter(d => pos[d.from] && pos[d.to]);
  const port = (list, key, other) => {
    const at = {};
    deps.forEach(d => (at[d[key]] = at[d[key]] || []).push(d));
    Object.values(at).forEach(group => {
      group.sort((p, q) => pos[p[other]][1] - pos[q[other]][1]);
      group.forEach((d, i) => { d[list] = (i - (group.length - 1) / 2) * Math.min(8, (H - 12) / group.length); });
    });
  };
  port('outY', 'from', 'to');
  port('inY', 'to', 'from');
  deps.sort((p, q) => critical.has(`${p.from}-${p.to}`) - critical.has(`${q.from}-${q.to}`));
  deps.forEach(dep => {
    const a = dep.from, b = dep.to, why = dep.reason;
    const [x1, y1] = pos[a], [x2, y2] = pos[b];
    const crit = critical.has(`${a}-${b}`);
    const sx = x1 + W, sy = y1 + H / 2 + dep.outY, ex = x2 - 8, ey = y2 + H / 2 + dep.inY;
    const aName = S[a]?.[0] || '#' + a, bName = S[b]?.[0] || '#' + b;
    // The longest chain is told by colour, so thickness can mean "hovered".
    const ink = crit ? 'var(--chain)' : 'var(--text-2)';
    g += `<g class="link dep${crit ? ' crit' : ''}" data-a="${a}" data-b="${b}"><path d="M${sx} ${sy} C${sx + GX / 2} ${sy} ${ex - GX / 2} ${ey} ${ex} ${ey}" fill="none" stroke="${ink}" stroke-width="${crit ? 2 : 1.5}"><title>${esc(bName)} waits on ${esc(aName)}: ${esc(why)}${crit ? ' (longest chain)' : ''}</title></path>
      <path d="M${ex} ${ey - 5} L${ex + 8} ${ey} L${ex} ${ey + 5} Z" fill="${ink}"/></g>`;
  });

  // Sprints
  Object.entries(pos).forEach(([id, [x, y]]) => {
    const [alias, mark, kind, unclear, s] = S[id] || ['', '', '', false, null];
    g += `<a class="node" data-sid="${id}" href="#/sprint/${id}?from=/planned"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="6" fill="var(--surface-2)" stroke="${unclear ? 'var(--unclear)' : kind === 'run' ? 'var(--st-prog)' : 'var(--border)'}" stroke-width="${unclear || kind === 'run' ? 2 : 1}"${unclear ? ' stroke-dasharray="3 3"' : ''}><title>${unclear ? 'Dependencies unclear: some cards are not assessed, so arrows into this sprint may be missing' : ''}</title></rect>
      ${unclear ? `<text x="${x + W / 2}" y="${y + H + 12}" font-size="10.5" text-anchor="middle" fill="var(--unclear)" font-weight="600">dependencies unclear</text>` : ''}
      <text x="${x + 10}" y="${y + H / 2 + 5}" font-size="13" fill="var(--text)"><tspan font-weight="600">${esc(alias)}</tspan>${alias ? ' ' : ''}<tspan fill="${alias ? 'var(--muted)' : 'var(--text)'}">#${id}</tspan></text>
      ${sprintNodeBadge(x, y, W, H, { run: kind === 'run', sprint: s, mark })}</a>`;
  });

  return `<svg class="dag" style="display:block" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${g}</svg>`;
}
// Hovering a sprint in the graph brings forward the links into and out of
// it, thicker, and fades the rest. The graph is re-rendered, so listen once
// on the document.
document.addEventListener('mouseover', e => {
  const node = e.target.closest?.('.dag .node'), dag = e.target.closest?.('.dag');
  document.querySelectorAll('.dag.focus').forEach(d => { if (d !== dag || !node) d.classList.remove('focus'); });
  if (!node) return;
  const sid = node.dataset.sid;
  dag.classList.add('focus');
  dag.querySelectorAll('.link').forEach(l => l.classList.toggle('hl', l.dataset.a === sid || l.dataset.b === sid));
});

V.planned = () => {
  if (!planned.length) return '<h1>Planned sprints</h1><p class="muted">No planned sprints.</p>';
  if (readinessState === 'idle') {
    loadReadiness();
  }

  const sum = READINESS?.summary;
  const queue = READINESS?.queue;
  const maxHours = queue ? Math.max(0.1, ...queue.map(s => s.hours || 0)) : 1;

  const kpisHtml = sum ? `
<div class="kpis">
  <div class="kpi"><div class="v">${sum.sprints}</div><div class="l">sprints</div></div>
  <div class="kpi"><div class="v">${sum.cards}</div><div class="l">cards</div></div>
  <div class="kpi"><div class="v">${sum.points}</div><div class="l">points</div></div>
  <div class="kpi"><div class="v">${num(sum.velocity, 2)} pts/h</div><div class="l">${sum.velocity_source === 'median' ? 'median velocity' : 'assumed: no history yet'}</div></div>
  <div class="kpi"><div class="v">≈ ${fmtH(sum.serial_hours)}</div><div class="l">one sprint at a time</div></div>
  <div class="kpi"><div class="v">≈ ${fmtH(sum.parallel_hours)}</div><div class="l">all in parallel</div></div>
</div>` : `
<div class="kpis">
  <div class="kpi"><div class="v">${sk('40px', 20)}</div><div class="l">sprints</div></div>
  <div class="kpi"><div class="v">${sk('40px', 20)}</div><div class="l">cards</div></div>
  <div class="kpi"><div class="v">${sk('40px', 20)}</div><div class="l">points</div></div>
  <div class="kpi"><div class="v">${sk('80px', 20)}</div><div class="l">velocity</div></div>
  <div class="kpi"><div class="v">${sk('80px', 20)}</div><div class="l">one sprint at a time</div></div>
  <div class="kpi"><div class="v">${sk('80px', 20)}</div><div class="l">all in parallel</div></div>
</div>`;

  const startable = queue ? queue.filter(s => s.state === 'Can start') : null;
  const startNowHtml = !queue ? `
<div class="grid g3">
  <div class="card">${sk('100%', 80)}</div>
</div>` : startable.length ? `
<div class="grid g3">
  ${startable.map(s => `
  <div class="card link" ${goto(s.sprint_id)}>
    <div class="row"><span class="state start">Can start</span><span class="sp"></span><span class="pill">position ${s.position}</span></div>
    <h3 style="margin:6px 0 2px">${s.alias ? `<span class="alias">${esc(s.alias)}</span> ` : ''}<span class="muted">#${s.sprint_id}</span> ${esc(s.title)}</h3>
    <div class="small t2">${s.points} pts · ≈ ${fmtH(s.hours)} · no blockers outside the sprint</div>
    <div class="small" style="margin-top:8px">No overlap with running sprints.</div>
  </div>`).join('')}
</div>` : '<p class="muted">No sprints are clear to start right now.</p>';

  const rowsHtml = !queue ? [1, 2, 3].map(i => `
  <tr>
    <td class="pos hide-sm">${i}</td>
    <td>${sk('180px', 16)}<div style="margin-top:4px">${sk('80%', 12)}</div></td>
    <td>${sk('90px', 16)}</td>
    <td>${skIcons(4)}</td>
    ${POINTS ? `<td>${sk('70px', 10)}</td>` : ''}
    <td class="hide-sm">${sk('100px', 14)}</td>
  </tr>`).join('') : queue.map(s => `
  <tr class="link" ${goto(s.sprint_id)}>
    <td class="pos hide-sm">${s.position}</td>
    <td>
      <div>${s.alias ? `<span class="alias">${esc(s.alias)}</span> ` : ''}<span class="muted">#${s.sprint_id}</span> <b>${esc(s.title)}</b></div>

    </td>
    <td>${stateBadge(s.state, s)}</td>
    <td>
      <div class="cicons hide-sm">${cardIconsHtml(s.cards || s.cards_count, s.undeclared)}</div>

    <div class="legend" style="margin:0 0 8px">

      <span><svg width="26" height="10"><line x1="1" y1="5" x2="20" y2="5" stroke="var(--chain)" stroke-width="2"/><path d="M19 1 L25 5 L19 9 Z" fill="var(--chain)"/></svg> longest chain</span>
      <span><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--overlap)" stroke-width="1.5" stroke-dasharray="4 3"/></svg> shares code</span>
      <span><span style="display:inline-block;width:14px;height:10px;border:2px solid var(--st-prog);border-radius:3px;vertical-align:-1px"></span> running</span>
