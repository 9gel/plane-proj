[project]
name = "plane-proj"
version = "0.21.12"
description = "A visible, governed multi-agent delivery framework for Plane."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "plane-sdk>=0.2.24",
    "click>=8.1",
    "markdown>=3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=13.0",
]

[project.scripts]
plane-proj = "plane_proj.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plane_proj"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
